function drawValidationBody(data, hyps, verdictData, body){
  const actionBar = `
    <div class="card action-bar">
      <div>
        <h2 style="font-size:16px;margin:0 0 4px;">&#9989; Evidence Evaluation</h2>
        <div class="desc">Evaluating each hypothesis using internal data (ERP, shipment, supplier records) and, optionally, external sources (news, weather, port/carrier status) to determine support, contradictions and confidence.</div>
      </div>
      <div class="spacer"></div>
      <label class="chk-row"><input type="checkbox" id="include-external-chk" /> Include external sources</label>
      ${verdictData ? `<div class="meta-right">Last evaluated<br/>${fmtDate(verdictData.generated_at)}</div>` : ''}
      <button class="btn btn-primary" id="run-val-btn">${verdictData ? 'Re-evaluate' : 'Evaluate Evidence'}</button>
    </div>`;

  if (!verdictData){
    body.innerHTML = actionBar + `
      <div class="card"><div class="empty-tab-body">
        <div class="big-ic">&#10003;</div>
        <div>No validation results yet.</div>
        <div style="margin-top:4px;font-size:12px;">Click "Evaluate Evidence" to retrieve real evidence and evaluate each hypothesis against it.</div>
      </div></div>`;
    document.getElementById('run-val-btn').addEventListener('click', () => runValidation(data, body));
    return;
  }

  const supported = verdictData.hypothesis_validations.filter(h => h.status === 'supported').length;
  const insufficient = verdictData.hypothesis_validations.filter(h => h.status === 'insufficient_evidence').length;
  const unsupported = verdictData.hypothesis_validations.filter(h => h.status === 'unsupported').length;
  const allCitations = verdictData.hypothesis_validations.flatMap(h => h.citations);
  const internalCount = allCitations.filter(c => c.kind === 'database' || c.kind === 'document').length;
  const externalCount = allCitations.filter(c => c.kind === 'external').length;
  const rootCause = verdictData.hypothesis_validations.find(h => h.hypothesis_id === verdictData.root_cause_hypothesis_id);

  body.innerHTML = actionBar + `
    <div class="section-head-row">
      <h2>Evaluation Summary</h2>
    </div>
    <div class="stat-row">
      <div class="card stat-tile"><div class="st-label">Hypotheses Evaluated</div><div class="st-value">${verdictData.hypothesis_validations.length}</div></div>
      <div class="card stat-tile"><div class="st-label">Supported</div><div class="st-value good">${supported}</div></div>
      <div class="card stat-tile"><div class="st-label">Insufficient Evidence</div><div class="st-value warn">${insufficient}</div></div>
      <div class="card stat-tile"><div class="st-label">Unsupported</div><div class="st-value bad">${unsupported}</div></div>
      <div class="card stat-tile"><div class="st-label">Evidence Items (Internal)</div><div class="st-value">${internalCount}</div></div>
      <div class="card stat-tile"><div class="st-label">Evidence Items (External)</div><div class="st-value">${externalCount}</div></div>
    </div>

    <div id="val-cards"></div>

    <div class="card section-card" style="margin-top:6px;border-left:3px solid var(--brand);">
      <div class="card-title">Grounded Finding</div>
      <div class="card-body">
        ${rootCause ? `<div style="margin-bottom:8px;"><b>Root cause hypothesis:</b> [${rootCause.rank}] ${esc(rootCause.statement)}</div>` : ''}
        <div style="margin-bottom:8px;"><b>Overall confidence:</b> ${verdictData.confidence}%</div>
        <div style="margin-bottom:8px;">${esc(verdictData.explanation)}</div>
        <div class="two-col" style="margin-top:10px;">
          <div><b style="font-size:11.5px;color:var(--text-dim);">SUPPORTING EVIDENCE</b><div style="margin-top:4px;">${esc(verdictData.supporting_evidence_summary)}</div></div>
          <div><b style="font-size:11.5px;color:var(--text-dim);">CONTRADICTING EVIDENCE</b><div style="margin-top:4px;">${esc(verdictData.contradicting_evidence_summary)}</div></div>
        </div>
        <div class="two-col" style="margin-top:10px;">
          <div><b style="font-size:11.5px;color:var(--text-dim);">REMAINING UNCERTAINTY</b><div style="margin-top:4px;">${esc(verdictData.remaining_uncertainty)}</div></div>
          <div><b style="font-size:11.5px;color:var(--text-dim);">EVIDENCE GAPS</b><div style="margin-top:4px;">${esc(verdictData.evidence_gaps)}</div></div>
        </div>
        <div style="margin-top:10px;"><b style="font-size:11.5px;color:var(--text-dim);">RECOMMENDED NEXT ACTION</b><div style="margin-top:4px;">${esc(verdictData.recommended_next_action)}</div></div>
      </div>
    </div>
  `;
  document.getElementById('run-val-btn').addEventListener('click', () => runValidation(data, body));
  drawValidationCards(verdictData, document.getElementById('val-cards'));
}

function drawValidationCards(verdictData, container){
  container.innerHTML = verdictData.hypothesis_validations.map((h, i) => `
    <div class="card hyp-card2" data-idx="${i}">
      <div class="hyp-card2-head">
        <div class="hyp-rank-sq ${esc(h.status)}">${h.rank}</div>
        <div style="flex:1;min-width:0;">
          <div class="hyp-card2-title-row">
            <span class="hyp-card2-title">${esc(h.statement)}</span>
            <span class="badge-status ${esc(h.status)}">${esc(titleCase(h.status))}</span>
          </div>
        </div>
        <div class="hyp-card2-right">
          <div class="confidence-inline"><div class="confidence-track"><div class="confidence-fill ${h.confidence >= 66 ? 'high' : (h.confidence >= 33 ? 'medium' : 'low')}" style="width:${h.confidence}%;"></div></div><span class="confidence-pct">${h.confidence}%</span></div>
          <span class="hyp-chevron">&#10095;</span>
        </div>
      </div>
      <div class="hyp-card2-body" style="display:none;"></div>
    </div>`).join('');

  container.querySelectorAll('.hyp-card2').forEach(card => {
    const head = card.querySelector('.hyp-card2-head');
    const chevron = card.querySelector('.hyp-chevron');
    const bodyEl = card.querySelector('.hyp-card2-body');
    head.addEventListener('click', () => {
      const open = bodyEl.style.display !== 'none';
      bodyEl.style.display = open ? 'none' : 'block';
      chevron.classList.toggle('open', !open);
      if (!open && !bodyEl.dataset.filled){
        bodyEl.dataset.filled = '1';
        const h = verdictData.hypothesis_validations[Number(card.dataset.idx)];
        bodyEl.innerHTML = renderValidationDetailBody(h);
        wireSubtabs(bodyEl);
      }
    });
  });
}

function wireSubtabs(scopeEl){
  scopeEl.querySelectorAll('.subtabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      scopeEl.querySelectorAll('.subtabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      scopeEl.querySelectorAll('.subtab-panel').forEach(p => p.style.display = 'none');
      scopeEl.querySelector(`.subtab-panel[data-panel="${btn.dataset.subtab}"]`).style.display = 'block';
    });
  });
}

function renderValidationDetailBody(h){
  const internal = h.citations.filter(c => c.kind === 'database' || c.kind === 'document');
  const external = h.citations.filter(c => c.kind === 'external');
  const kindLabel = { database: 'ERP', document: 'Document', external: 'External' };

  const evidencePanel = `
    ${h.status === 'insufficient_evidence' ? `
      <div class="card" style="background:var(--medium-bg);border-color:var(--medium);padding:12px 14px;margin-bottom:12px;">
        <b style="color:var(--medium);">Evidence insufficient</b> — confidence ${h.confidence}%. ${esc(h.reasoning)}
      </div>` : ''}
    <div class="ev-two-col">
      <div>
        <div class="ev-col-title"><span>Internal Evidence (${internal.length})</span></div>
        ${internal.length ? internal.map(c => `
          <div class="ev-item">
            <span class="source-tag database">${esc(kindLabel[c.kind])}</span>
            <span class="ev-item-title">${esc(c.reference)}</span>
            ${c.text ? `<div class="ev-item-text">${esc(c.text)}</div>` : ''}
            <div class="ev-item-meta">${c.supports ? 'Supports' : (c.contradicts ? 'Contradicts' : 'Neutral')} &middot; ${esc(titleCase(c.strength))} strength</div>
          </div>`).join('') : `<div class="empty-cell">No internal evidence.</div>`}
      </div>
      <div>
        <div class="ev-col-title"><span>External Evidence (${external.length})</span></div>
        ${external.length ? external.map(c => `
          <div class="ev-item">
            <span class="source-tag external">EXT</span>
            <span class="ev-item-title">${esc(c.reference)}</span>
            ${c.text ? `<div class="ev-item-text">${esc(c.text)}</div>` : ''}
            <div class="ev-item-meta">${c.supports ? 'Supports' : (c.contradicts ? 'Contradicts' : 'Neutral')} &middot; ${esc(titleCase(c.strength))} strength</div>
          </div>`).join('') : `<div class="empty-cell">No external evidence identified.</div>`}
      </div>
    </div>
  `;

  const reasoningPanel = `
    <div style="font-size:12.5px;color:var(--text);line-height:1.65;">${esc(h.reasoning)}</div>
    ${h.contradicting_evidence_summary ? `
      <h4 style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-dim);margin:14px 0 8px;">Contradicting Evidence</h4>
      <div style="font-size:12.5px;color:var(--text);line-height:1.6;">${esc(h.contradicting_evidence_summary)}</div>
    ` : `<div style="margin-top:14px;font-size:12px;color:var(--text-faint);">No contradicting evidence identified.</div>`}
  `;

  const citationsPanel = h.citations.length ? h.citations.map(c => `
    <div class="citation-chip">
      <span class="source-tag ${esc(c.kind)}">${esc(kindLabel[c.kind] || c.kind)}</span>
      <span class="cc-ref">Evidence ${c.evidence_number} — ${esc(c.reference)}</span>
    </div>`).join('') : `<div class="empty-cell">No citations.</div>`;

  return `
    <div class="subtabs">
      <button class="active" data-subtab="evidence">Evidence (${h.citations.length})</button>
      <button data-subtab="reasoning">Reasoning</button>
      <button data-subtab="citations">Citations (${h.citations.length})</button>
    </div>
    <div class="subtab-panel" data-panel="evidence">${evidencePanel}</div>
    <div class="subtab-panel" data-panel="reasoning" style="display:none;">${reasoningPanel}</div>
    <div class="subtab-panel" data-panel="citations" style="display:none;">${citationsPanel}</div>
  `;
}

async function runValidation(data, body){
  const includeExternal = document.getElementById('include-external-chk') ? document.getElementById('include-external-chk').checked : false;
  document.getElementById('run-val-btn') && document.getElementById('run-val-btn').setAttribute('disabled', 'true');
  body.innerHTML = `
    <div class="card processing-card">
      <div class="processing-spinner"></div>
      <h2>Evaluating Evidence</h2>
      <ul class="p-steps" style="margin-top:10px;">
        <li class="on"><span class="dot"></span>Loading investigation context</li>
        <li class="on"><span class="dot"></span>Loading generated hypotheses</li>
        <li class="on"><span class="dot"></span>Retrieving relevant evidence${includeExternal ? ' (internal + external)' : ' (internal)'}</li>
        <li class="on"><span class="dot"></span>Evaluating evidence against hypotheses</li>
        <li class="on"><span class="dot"></span>Calculating confidence &amp; preparing results</li>
      </ul>
      <div class="please-wait">This is one real request to the backend validation service -- the steps above describe what it does end-to-end, not live progress.</div>
    </div>`;
  try{
    await api(`/investigations/${data.run_id}/verdict?include_external=${includeExternal}`, { method: 'POST' });
    renderInvestigationShell(data.run_id, 'validation');
  } catch(err){
    body.innerHTML = `<div class="card error-card"><div class="e-ic">&#9888;</div><h2>Evidence evaluation failed</h2><p>${esc(err.message)}</p><button class="btn btn-primary" id="retry-run-val">Try Again</button></div>`;
    document.getElementById('retry-run-val').addEventListener('click', () => runValidation(data, body));
  }
}

/* ================= MITIGATION PAGE (route: /investigations/{runId}/mitigation) =================
   Phase 4: mitigation strategy generation. Consumes ONLY the already-
   persisted Verdict (Phase 3's grounded finding) -- it never re-runs the
   investigation, never regenerates hypotheses, and never determines a
   new root cause. Maps to:
     python -m logisense.cli generate-mitigations --run-id <RUN_ID>
   via POST/GET /investigations/{runId}/mitigations. Every strategy field
   shown below comes from the real MitigationStrategy rows the backend
   persisted -- category, priority, urgency and confidence are all
   deterministic scoring done server-side, never computed here. */
function renderMitigationPage(data, verdictData, mitigationData, body){
  if (!verdictData){
    body.innerHTML = `
      <div class="card"><div class="empty-tab-body">
        <div class="big-ic">&#128737;</div>
        <div>No grounded finding yet.</div>
        <div style="margin-top:4px;font-size:12px;">Mitigation strategies are generated from the investigation's own evidence evaluation. <a href="#/investigations/${data.run_id}/validation" style="color:var(--brand);font-weight:600;">Run Evidence Evaluation</a> first.</div>
      </div></div>`;
    return;
  }
  drawMitigationBody(data, verdictData, mitigationData, body);
}

function drawMitigationBody(data, verdictData, mitigationData, body){
  const actionBar = `
    <div class="card action-bar">
      <div>
        <h2 style="font-size:16px;margin:0 0 4px;">&#128737; Mitigation Strategies</h2>
        <div class="desc">Generating evidence-grounded mitigation strategies from this run's confirmed finding -- categorized, validated and scored by the backend, never invented here.</div>
      </div>
      <div class="spacer"></div>
      ${mitigationData ? `<div class="meta-right">Last generated<br/>${fmtDate(mitigationData.strategies[0] && mitigationData.strategies[0].generated_at)}</div>` : ''}
      <button class="btn btn-primary" id="run-mit-btn">${mitigationData ? 'Regenerate' : 'Generate Mitigations'}</button>
    </div>`;

  if (!mitigationData){
    body.innerHTML = actionBar + `
      <div class="card"><div class="empty-tab-body">
        <div class="big-ic">&#128737;</div>
        <div>No mitigation strategies generated yet.</div>
        <div style="margin-top:4px;font-size:12px;">Click "Generate Mitigations" to produce evidence-grounded strategies from this investigation's finding.</div>
      </div></div>`;
    document.getElementById('run-mit-btn').addEventListener('click', () => generateMitigations(data, body));
    return;
  }

  const strategies = mitigationData.strategies || [];
  const confirmedCount = strategies.filter(s => s.is_confirmed_corrective_action).length;
  const preventiveCount = strategies.length - confirmedCount;
  const flaggedCount = strategies.filter(s => s.validation_status === 'flagged').length;

  body.innerHTML = actionBar + `
    <div class="section-head-row"><h2>Mitigation Summary</h2></div>
    <div class="stat-row">
      <div class="card stat-tile"><div class="st-label">Root Cause Status</div><div class="st-value" style="font-size:14px;">${esc(titleCase(mitigationData.root_cause_status))}</div></div>
      <div class="card stat-tile"><div class="st-label">Strategies</div><div class="st-value">${strategies.length}</div></div>
      <div class="card stat-tile"><div class="st-label">Confirmed Corrective</div><div class="st-value good">${confirmedCount}</div></div>
      <div class="card stat-tile"><div class="st-label">Preventive / Risk-Reduction</div><div class="st-value">${preventiveCount}</div></div>
      <div class="card stat-tile"><div class="st-label">Flagged</div><div class="st-value ${flaggedCount ? 'warn' : ''}">${flaggedCount}</div></div>
      <div class="card stat-tile"><div class="st-label">Rejected</div><div class="st-value ${mitigationData.rejected_count ? 'bad' : ''}">${mitigationData.rejected_count}</div></div>
    </div>
    ${mitigationData.categories_identified && mitigationData.categories_identified.length ? `
      <div style="margin:4px 0 14px;">${mitigationData.categories_identified.map(c => `<span class="mit-tag">${esc(titleCase(c))}</span>`).join('')}</div>
    ` : ''}
    <div id="mit-cards"></div>
    ${!strategies.length ? `<div class="card"><div class="empty-cell">No mitigation strategies survived validation for this run.</div></div>` : ''}
  `;
  document.getElementById('run-mit-btn').addEventListener('click', () => generateMitigations(data, body));
  drawMitigationCards(strategies, document.getElementById('mit-cards'));
}

function drawMitigationCards(strategies, container){
  container.innerHTML = strategies.map((s, i) => `
    <div class="card hyp-card2 mit-card ${s.is_confirmed_corrective_action ? 'confirmed' : ''}" data-idx="${i}">
      <div class="hyp-card2-head">
        <div class="hyp-rank-sq ${s.priority === 'critical' || s.priority === 'high' ? 'unsupported' : (s.priority === 'medium' ? 'insufficient_evidence' : 'supported')}">${i + 1}</div>
        <div style="flex:1;min-width:0;">
          <div class="hyp-card2-title-row">
            <span class="hyp-card2-title">${esc(s.title)}</span>
            <span class="badge-status prio-${esc(s.priority)}">${esc(titleCase(s.priority))} priority</span>
            ${s.validation_status !== 'valid' ? `<span class="badge-status valstat-${esc(s.validation_status)}">${esc(titleCase(s.validation_status))}</span>` : ''}
          </div>
          <div class="mit-meta-row">
            <span class="mit-tag">${esc(titleCase(s.strategy_type))}</span>
            <span class="mit-tag">${s.is_confirmed_corrective_action ? 'Confirmed Corrective Action' : 'Preventive / Risk-Reduction'}</span>
            <span class="mit-tag">${esc(titleCase(s.urgency))}</span>
          </div>
        </div>
        <div class="hyp-card2-right">
          <div class="confidence-inline"><div class="confidence-track"><div class="confidence-fill ${s.confidence >= 66 ? 'high' : (s.confidence >= 33 ? 'medium' : 'low')}" style="width:${s.confidence}%;"></div></div><span class="confidence-pct">${Math.round(s.confidence)}%</span></div>
          <span class="hyp-chevron">&#10095;</span>
        </div>
      </div>
      <div class="hyp-card2-body" style="display:none;"></div>
    </div>`).join('');

  container.querySelectorAll('.hyp-card2').forEach(card => {
    const head = card.querySelector('.hyp-card2-head');
    const chevron = card.querySelector('.hyp-chevron');
    const bodyEl = card.querySelector('.hyp-card2-body');
    head.addEventListener('click', () => {
      const open = bodyEl.style.display !== 'none';
      bodyEl.style.display = open ? 'none' : 'block';
      chevron.classList.toggle('open', !open);
      if (!open && !bodyEl.dataset.filled){
        bodyEl.dataset.filled = '1';
        bodyEl.innerHTML = renderMitigationDetailBody(strategies[Number(card.dataset.idx)]);
      }
    });
  });
}

function renderMitigationDetailBody(s){
  return `
    <div class="three-col">
      <div>
        <div class="tc-title">&#128203; Description</div>
        <div class="tc-body">${esc(s.description)}</div>
        <div class="tc-title" style="margin-top:12px;">Why This Mitigation</div>
        <div class="tc-body">${esc(s.why_this_mitigation)}</div>
        <div class="tc-title" style="margin-top:12px;">Risk Addressed</div>
        <div class="tc-body">${esc(s.risk_addressed)}</div>
      </div>
      <div>
        <div class="tc-title">&#9776; Implementation Steps</div>
        <ol class="mit-steps">${s.implementation_steps.map(step => `<li>${esc(step)}</li>`).join('')}</ol>
        <div class="tc-title" style="margin-top:12px;">Expected Impact</div>
        <div class="tc-body">${esc(s.expected_impact)}</div>
        ${s.limitations ? `<div class="tc-title" style="margin-top:12px;">Limitations</div><div class="tc-body">${esc(s.limitations)}</div>` : ''}
      </div>
      <div>
        <div class="tc-title">&#128279; Investigation Basis</div>
        <ul class="mini-evidence-list">${s.investigation_basis.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
        ${s.dependencies && s.dependencies.length ? `<div class="tc-title" style="margin-top:12px;">Dependencies</div><ul class="mini-evidence-list">${s.dependencies.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}
        ${s.success_metrics && s.success_metrics.length ? `<div class="tc-title" style="margin-top:12px;">Success Metrics</div><ul class="mini-evidence-list">${s.success_metrics.map(m => `<li>${esc(m)}</li>`).join('')}</ul>` : ''}
      </div>
    </div>
    ${s.validation_status === 'flagged' && s.validation_notes ? `<div class="mit-flag-note"><b>Validation note:</b> ${esc(s.validation_notes)}</div>` : ''}
  `;
}

async function generateMitigations(data, body){
  document.getElementById('run-mit-btn') && document.getElementById('run-mit-btn').setAttribute('disabled', 'true');
  body.innerHTML = `
    <div class="card processing-card">
      <div class="processing-spinner"></div>
      <h2>Generating Mitigation Strategies</h2>
      <ul class="p-steps" style="margin-top:10px;">
        <li class="on"><span class="dot"></span>Loading the investigation's grounded finding</li>
        <li class="on"><span class="dot"></span>Identifying applicable mitigation categories</li>
        <li class="on"><span class="dot"></span>Generating evidence-grounded strategies</li>
        <li class="on"><span class="dot"></span>Validating each strategy against the evidence</li>
        <li class="on"><span class="dot"></span>Scoring priority, urgency and confidence</li>
      </ul>
      <div class="please-wait">This is one real request to the backend mitigation-generation service -- the steps above describe what it does end-to-end, not live progress.</div>
    </div>`;
  try{
    await api(`/investigations/${data.run_id}/mitigations`, { method: 'POST' });
    renderInvestigationShell(data.run_id, 'mitigation');
  } catch(err){
    body.innerHTML = `<div class="card error-card"><div class="e-ic">&#9888;</div><h2>Mitigation generation failed</h2><p>${esc(err.message)}</p><button class="btn btn-primary" id="retry-run-mit">Try Again</button></div>`;
    document.getElementById('retry-run-mit').addEventListener('click', () => generateMitigations(data, body));
  }
}

/* ================= EVIDENCE / RAG PAGE (route: /investigations/{runId}/evidence) =================
   Flattens the real citations already returned by validation --
   retrieval happens on the backend during evaluation, so this doesn't
   call a separate, duplicate retrieval path. */
function renderEvidencePage(data, verdictData, body){
  if (!verdictData){
    body.innerHTML = `
      <div class="card"><div class="empty-tab-body">
        <div class="big-ic">&#128196;</div>
        <div>No evidence retrieved yet.</div>
        <div style="margin-top:4px;font-size:12px;">Evidence is gathered during evaluation. <a href="#/investigations/${data.run_id}/validation" style="color:var(--brand);font-weight:600;">Run Evidence Evaluation</a> first.</div>
      </div></div>`;
    return;
  }

  body.innerHTML = `
    <div class="toolbar">
      <select id="ev-filter" class="btn btn-outline btn-sm" style="cursor:pointer;">
        <option value="all">All Sources</option>
        <option value="database">Database (ERP)</option>
        <option value="document">Documents</option>
        <option value="external">External</option>
      </select>
      <div style="font-size:12px;color:var(--text-dim);">From ${verdictData.hypothesis_validations.length} hypothesis evaluation(s)</div>
    </div>
    <div id="ev-list"></div>`;

  const allCitations = [];
  verdictData.hypothesis_validations.forEach(h => h.citations.forEach(c => allCitations.push({ ...c, hyp_rank: h.rank, hyp_statement: h.statement })));

  function draw(filter){
    const rows = filter === 'all' ? allCitations : allCitations.filter(c => c.kind === filter);
    const list = document.getElementById('ev-list');
    if (!rows.length){ list.innerHTML = `<div class="card"><div class="empty-cell">No evidence of this kind was retrieved.</div></div>`; return; }
    const kindLabel = { database: 'ERP / Database', document: 'Document', external: 'External Source' };
    list.innerHTML = rows.map(c => `
      <div class="card" style="padding:14px 16px;margin-bottom:10px;">
        <span class="source-tag ${esc(c.kind)}">${esc(kindLabel[c.kind] || c.kind)}</span>
        ${c.supports ? '<span style="color:var(--good);font-weight:600;font-size:11px;">&#10003; Supports</span>' : (c.contradicts ? '<span style="color:var(--bad);font-weight:600;font-size:11px;">&#10007; Contradicts</span>' : '')}
        <div style="font-family:var(--mono);font-size:11px;color:var(--text-faint);margin-top:6px;">${esc(c.reference)}</div>
        ${c.text ? `<div style="font-size:12.5px;margin-top:6px;">${esc(c.text)}</div>` : ''}
        <div style="margin-top:8px;font-size:11px;color:var(--text-faint);">For hypothesis [${c.hyp_rank}] ${esc(c.hyp_statement)} &nbsp;|&nbsp; Strength: ${esc(titleCase(c.strength))}</div>
      </div>`).join('');
  }
  draw('all');
  document.getElementById('ev-filter').addEventListener('change', (e) => draw(e.target.value));
}

/* ================= ANALYSIS PAGE (route: /investigations/{runId}/analysis) =================
   Free-text question answered from the same multi-source backend as:
     python -m logisense.cli analyze "<QUESTION>"
   Not scoped to a single run_id (the endpoint is general-purpose), but
   100% real -- internal DB + internal RAG + external sources. */
function renderAnalysisPage(data, body){
  body.innerHTML = `
    <div class="card action-bar">
      <div>
        <h2 style="font-size:16px;margin:0 0 4px;">Ask a Question</h2>
        <div class="desc">Answered from real internal data (database + company documents) and external sources (weather/maritime/news) where relevant. Not limited to this incident.</div>
      </div>
    </div>
    <div class="ask-box">
      <input type="text" id="analysis-question" placeholder="e.g. What is the status of Purchase Order PO-83921?" />
      <button class="btn btn-primary" id="analysis-ask-btn">Ask</button>
    </div>
    <div id="analysis-result"></div>
  `;
  const ask = async () => {
    const q = document.getElementById('analysis-question').value.trim();
    if (!q) return;
    const resultEl = document.getElementById('analysis-result');
    resultEl.innerHTML = `<div class="empty-state">Analyzing…</div>`;
    try{
      const resp = await api('/analyze', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ question: q }) });
      const statusTags = Object.entries(resp.source_status || {}).map(([src, st]) =>
        `<span class="source-status-tag ${st === 'ok' ? 'ok' : (st === 'unavailable' ? 'unavailable' : '')}">${esc(titleCase(src))}: ${esc(st)}</span>`
      ).join('');
      resultEl.innerHTML = `
        <div class="source-status-row">${statusTags}</div>
        <div class="card section-card">
          <div class="card-title">Answer ${resp.sufficient_evidence ? '' : '<span style="color:var(--medium);font-weight:600;">(insufficient evidence)</span>'}</div>
          <div class="card-body">${esc(resp.answer).replace(/\n/g,'<br/>')}</div>
        </div>
        ${resp.citations && resp.citations.length ? `
        <div class="card section-card">
          <div class="card-title">Citations (${resp.citations.length})</div>
          <div class="card-body">
            ${resp.citations.map(c => `
              <div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border);">
                <div style="font-family:var(--mono);font-size:11px;color:var(--text-faint);">${esc(c.citation_text)} &middot; ${esc(c.source_type)} / ${esc(c.source_name)}</div>
                <div style="font-size:12.5px;margin-top:4px;">${esc(c.content)}</div>
              </div>`).join('')}
          </div>
        </div>` : ''}
      `;
    } catch(err){
      resultEl.innerHTML = `<div class="card error-card"><div class="e-ic">&#9888;</div><h2>Analysis failed</h2><p>${esc(err.message)}</p></div>`;
    }
  };
  document.getElementById('analysis-ask-btn').addEventListener('click', ask);
  document.getElementById('analysis-question').addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(); });
}

function formatAsList(text, numbered){
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean).map(l => l.replace(/^[-*]\s*/, '').replace(/^\d+\.\s*/, ''));
  if (!lines.length) return esc(text);
  const tag = numbered ? 'ol' : 'ul';
  return `<${tag}>${lines.map(l => `<li>${esc(l)}</li>`).join('')}</${tag}>`;
}

/* ---- boot ---- */
render();
</script>
</body>
</html>
